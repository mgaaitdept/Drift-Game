<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DRIFT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e14;
    --bg2:#0d131b;
    --cyan:#4deeea;
    --magenta:#f951a3;
    --ink:#e8f1f5;
    --muted:#5b6b7a;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    background-image:radial-gradient(circle at 50% 0%, var(--bg2), var(--bg) 65%);
    color:var(--ink);
    font-family:'Space Grotesk', system-ui, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100%;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  .stage{
    position:relative;
    width:min(94vw, 440px);
    aspect-ratio:9/16;
    max-height:92vh;
    border-radius:18px;
    overflow:hidden;
    background:#070a10;
    box-shadow:0 0 0 1px rgba(77,238,234,0.15), 0 30px 80px -20px rgba(0,0,0,0.8);
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
  }
  .hud{
    position:absolute;
    top:0; left:0; right:0;
    padding:16px 18px 0;
    padding-top:calc(16px + env(safe-area-inset-top,0px));
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
    font-weight:500;
  }
  .score{
    font-size:28px;
    letter-spacing:0.5px;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .best{
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
  }
  .badge{
    font-size:11px;
    color:var(--cyan);
    border:1px solid rgba(77,238,234,0.35);
    padding:5px 10px;
    border-radius:999px;
    background:rgba(77,238,234,0.06);
  }
  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    gap:16px;
    padding:32px;
    background:rgba(7,10,16,0.78);
    backdrop-filter:blur(6px);
    transition:opacity 0.25s ease;
  }
  .overlay.hidden{
    opacity:0;
    pointer-events:none;
  }
  .title{
    font-size:44px;
    font-weight:700;
    letter-spacing:1px;
    line-height:1;
    background:linear-gradient(135deg, var(--cyan), var(--magenta));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .sub{
    color:var(--muted);
    font-size:14px;
    max-width:260px;
    line-height:1.5;
  }
  .result{
    font-size:16px;
    color:var(--ink);
    margin-top:-4px;
  }
  .result b{ color:var(--magenta); font-weight:700; }
  .btn{
    margin-top:8px;
    padding:13px 30px;
    border-radius:999px;
    border:1px solid var(--cyan);
    background:transparent;
    color:var(--cyan);
    font-family:inherit;
    font-size:15px;
    font-weight:500;
    letter-spacing:0.3px;
    cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease, transform 0.1s ease;
  }
  .btn:active{ transform:scale(0.96); }
  .btn:hover{ background:var(--cyan); color:#07131a; }
  .hint{
    position:absolute;
    bottom:18px;
    left:0; right:0;
    text-align:center;
    color:var(--muted);
    font-size:12px;
    padding-bottom:env(safe-area-inset-bottom,0px);
    pointer-events:none;
  }
  .fireBtn{
    position:absolute;
    right:18px;
    bottom:calc(18px + env(safe-area-inset-bottom,0px));
    width:56px; height:56px;
    border-radius:50%;
    border:1px solid rgba(77,238,234,0.4);
    background:rgba(77,238,234,0.08);
    color:var(--cyan);
    font-family:inherit;
    font-weight:700;
    font-size:16px;
    touch-action:none;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){ --bg:#0a0e14; --bg2:#0d131b; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="game"></canvas>
    <div class="hud">
      <div>
        <div class="score" id="score">0</div>
        <div class="best" id="best">best 0</div>
      </div>
      <div class="badge" id="badge">DRIFT</div>
    </div>
    <div class="overlay" id="overlay">
      <div class="title">DRIFT</div>
      <div class="sub">Dodge the gates, drifting orbs and their shots. Every so often a boss shows up — survive its volley to push on.</div>
      <button class="btn" id="startBtn">Start</button>
    </div>
    <div class="hint" id="hint">drag or A / D to move · hold F to shoot</div>
    <button class="fireBtn" id="fireBtn" aria-label="Shoot">F</button>
  </div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const hint = document.getElementById('hint');
  const badge = document.getElementById('badge');

  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = stage.clientWidth;
    H = stage.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  let BEST = 0;
  try { BEST = parseInt(localStorage.getItem('drift_best') || '0', 10) || 0; } catch(e){}
  bestEl.textContent = 'best ' + BEST;

  let running = false;
  let player, gates, particles, obstacles, projectiles, bullets, boss, t, speed, score, targetX, nextObstacleAt, nextBossScore;
  let firing = false, fireCooldown = 0;
  let keyLeft = false, keyRight = false, keyVel = 0;

  function reset(){
    player = { x: W/2, y: H - 90, r: 9, vx: 0 };
    gates = [];
    particles = [];
    t = 0;
    speed = 1.8;
    score = 0;
    targetX = W/2;
    spawnGates(H * 0.55);
    obstacles = [];
    projectiles = [];
    bullets = [];
    boss = null;
    nextObstacleAt = 170 + Math.random()*140;
    nextBossScore = 20;
    fireCooldown = 0;
  }

  function spawnGates(startY){
    let gy = startY;
    for(let i=0;i<5;i++){
      gates.push(makeGate(gy));
      gy -= 190;
    }
  }

  function makeGate(y){
    const gapW = Math.max(100, 170 - score*0.8);
    const margin = 30;
    const cx = margin + gapW/2 + Math.random() * (W - margin*2 - gapW);
    return { y, cx, gapW, passed:false };
  }

  function spark(x,y,color){
    for(let i=0;i<10;i++){
      particles.push({
        x,y,
        vx:(Math.random()-0.5)*4,
        vy:(Math.random()-0.5)*4,
        life:1,
        color
      });
    }
  }

  function endGame(){
    running = false;
    if(score > BEST){
      BEST = score;
      try { localStorage.setItem('drift_best', String(BEST)); } catch(e){}
    }
    bestEl.textContent = 'best ' + BEST;
    overlay.classList.remove('hidden');
    overlay.querySelector('.title').textContent = 'RUN OVER';
    let sub = overlay.querySelector('.sub');
    sub.outerHTML = '<div class="result">You reached <b>' + score + '</b></div>';
    startBtn.textContent = 'Try again';
    hint.style.opacity = 1;
  }

  function loop(){
    if(!running) return;
    try{
    t++;
    speed += 0.0015;
    const accel = 1.15, maxKeyV = 10, damp = 0.86;
    if(keyLeft && !keyRight) keyVel -= accel;
    else if(keyRight && !keyLeft) keyVel += accel;
    else keyVel *= damp;
    keyVel = Math.max(-maxKeyV, Math.min(maxKeyV, keyVel));
    targetX = Math.max(0, Math.min(W, targetX + keyVel));

    player.x += (targetX - player.x) * 0.2;
    player.x = Math.max(player.r+4, Math.min(W-player.r-4, player.x));

    for(let i=gates.length-1;i>=0;i--){
      const g = gates[i];
      g.y += speed;
      if(!g.passed && g.y > player.y){
        g.passed = true;
        const left = g.cx - g.gapW/2;
        const right = g.cx + g.gapW/2;
        if(player.x < left || player.x > right){
          spark(player.x, player.y, '#f951a3');
          draw();
          endGame();
          return;
        } else {
          score++;
          scoreEl.textContent = score;
          spark(player.x, player.y, '#4deeea');
          if(!boss && score >= nextBossScore){
            boss = { x:W/2, y:70, dir:1, hp:22, maxHp:22, timer:900, fireTimer:70, phase:1 };
            badge.textContent = 'BOSS';
            gates = [];
            break;
          }
        }
      }
      if(g.y - 200 > H) {
        gates.splice(i,1);
        gates.push(makeGate(Math.min(...gates.map(g=>g.y)) - 190));
      }
    }

    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.life -= 0.04;
      if(p.life<=0) particles.splice(i,1);
    }

    nextObstacleAt -= 1;
    if(nextObstacleAt <= 0){
      const r = 14 + Math.random()*11;
      const hp = Math.max(1, Math.round(r/9));
      obstacles.push({
        x: 24 + Math.random() * (W - 48),
        y: -30,
        r,
        hp, maxHp: hp,
        drift: (Math.random()-0.5) * 1.8,
        shooter: Math.random() < 0.45,
        fired: false
      });
      nextObstacleAt = 150 + Math.random() * 150;
    }
    for(let i=obstacles.length-1;i>=0;i--){
      const o = obstacles[i];
      o.y += speed * 1.05;
      o.x += o.drift;
      if(o.x < o.r || o.x > W - o.r) o.drift *= -1;
      if(o.shooter && !o.fired && o.y > H*0.32){
        o.fired = true;
        const dx = player.x - o.x, dy = player.y - o.y;
        const d = Math.sqrt(dx*dx+dy*dy) || 1;
        const spd = 3.6;
        projectiles.push({ x:o.x, y:o.y, vx:(dx/d)*spd, vy:(dy/d)*spd, r:4 });
      }
      const dx = player.x - o.x, dy = player.y - o.y;
      if(Math.sqrt(dx*dx+dy*dy) < player.r + o.r - 3){
        spark(player.x, player.y, '#f951a3');
        draw();
        endGame();
        return;
      }
      if(o.y - 40 > H) obstacles.splice(i,1);
    }

    fireCooldown--;
    if(firing && fireCooldown <= 0){
      bullets.push({ x: player.x, y: player.y - 14, vy: -9 });
      fireCooldown = 9;
    }
    for(let i=bullets.length-1;i>=0;i--){
      const b = bullets[i];
      b.y += b.vy;
      let hit = false;
      for(let j=obstacles.length-1;j>=0;j--){
        const o = obstacles[j];
        const dx = b.x - o.x, dy = b.y - o.y;
        if(Math.sqrt(dx*dx+dy*dy) < o.r + 3){
          o.hp--;
          spark(b.x, b.y, '#4deeea');
          hit = true;
          if(o.hp <= 0){
            score += 2;
            scoreEl.textContent = score;
            spark(o.x, o.y, '#4deeea');
            obstacles.splice(j,1);
          }
          break;
        }
      }
      if(!hit && boss){
        const dx = b.x - boss.x, dy = b.y - boss.y;
        if(Math.sqrt(dx*dx+dy*dy) < 30){
          boss.hp--;
          spark(b.x, b.y, '#ffce54');
          hit = true;
        }
      }
      if(hit || b.y < -20) bullets.splice(i,1);
    }

    for(let i=projectiles.length-1;i>=0;i--){
      const p = projectiles[i];
      p.x += p.vx; p.y += p.vy;
      const dx = player.x - p.x, dy = player.y - p.y;
      if(Math.sqrt(dx*dx+dy*dy) < player.r + p.r - 2){
        spark(player.x, player.y, '#f951a3');
        draw();
        endGame();
        return;
      }
      if(p.y < -40 || p.y > H+40 || p.x < -40 || p.x > W+40) projectiles.splice(i,1);
    }

    updateBoss();

    draw();
    } catch(e){ console.error('frame error, recovering:', e); }
    requestAnimationFrame(loop);
  }

  function updateBoss(){
    if(!boss) return;
    const hpFrac = boss.hp / boss.maxHp;
    const phase = hpFrac > 0.66 ? 1 : hpFrac > 0.33 ? 2 : 3;
    if(phase !== boss.phase){
      boss.phase = phase;
      boss.fireTimer = 22;
      spark(boss.x, boss.y, '#ffce54');
      badge.textContent = phase === 3 ? 'BOSS ⚡' : 'BOSS';
    }
    const phaseSpeedMul = boss.phase === 1 ? 1 : boss.phase === 2 ? 1.3 : 1.7;
    boss.x += boss.dir * (2.2 + speed*0.3) * phaseSpeedMul;
    if(boss.phase === 3) boss.x += Math.sin(t*0.08) * 1.4;
    if(boss.x < 60 || boss.x > W-60) boss.dir *= -1;
    boss.timer--;
    boss.fireTimer--;
    if(boss.fireTimer <= 0){
      if(boss.phase === 1){
        // spread: a fan of shots downward
        const spreadCount = 3;
        const spread = 0.55;
        for(let i=0;i<spreadCount;i++){
          const a = Math.PI/2 + (i - (spreadCount-1)/2) * (spread / Math.max(1,spreadCount-1)) * 2;
          const spd = 3.2 + speed*0.15;
          projectiles.push({ x:boss.x, y:boss.y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd, r:5 });
        }
        boss.fireTimer = 62;
      } else if(boss.phase === 2){
        // aimed: shots locked onto the player's position
        const dx = player.x - boss.x, dy = player.y - boss.y;
        const d = Math.sqrt(dx*dx+dy*dy) || 1;
        const spd = 4.4 + speed*0.15;
        for(let k=0;k<2;k++){
          const jitter = (k - 0.5) * 0.18;
          const a = Math.atan2(dy,dx) + jitter;
          projectiles.push({ x:boss.x, y:boss.y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd, r:5 });
        }
        boss.fireTimer = 42;
      } else {
        // enraged: a full ring burst that spins each volley
        const ringCount = 10;
        const spd = 3.6 + speed*0.15;
        for(let k=0;k<ringCount;k++){
          const a = (k/ringCount) * Math.PI*2 + t*0.02;
          projectiles.push({ x:boss.x, y:boss.y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd, r:5 });
        }
        boss.fireTimer = 34;
      }
    }
    const dx = player.x - boss.x, dy = player.y - boss.y;
    if(Math.sqrt(dx*dx+dy*dy) < player.r + 30){
      spark(player.x, player.y, '#f951a3');
      draw();
      endGame();
      return;
    }
    if(boss.hp <= 0 || boss.timer <= 0){
      const defeated = boss.hp <= 0;
      spark(boss.x, boss.y, defeated ? '#4deeea' : '#f951a3');
      score += defeated ? 15 : 5;
      scoreEl.textContent = score;
      boss = null;
      badge.textContent = 'DRIFT';
      nextBossScore = score + 30 + Math.floor(Math.random()*10);
      spawnGates(-60);
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    // faint grid drift
    ctx.strokeStyle = 'rgba(77,238,234,0.05)';
    ctx.lineWidth = 1;
    const off = (t*speed*0.6) % 40;
    for(let y = -off; y < H; y += 40){
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
    }

    // gates
    gates.forEach(g=>{
      const left = g.cx - g.gapW/2;
      const right = g.cx + g.gapW/2;
      const grad = ctx.createLinearGradient(0,0,W,0);
      grad.addColorStop(0,'#4deeea');
      grad.addColorStop(1,'#f951a3');
      ctx.fillStyle = grad;
      ctx.globalAlpha = 0.85;
      ctx.fillRect(0, g.y-5, left, 10);
      ctx.fillRect(right, g.y-5, W-right, 10);
      ctx.globalAlpha = 1;
    });

    // obstacles
    obstacles.forEach(o=>{
      ctx.save();
      ctx.shadowColor = '#f951a3';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#f951a3';
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
      if(o.maxHp > 1){
        const bw = o.r * 1.8;
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(o.x - bw/2, o.y - o.r - 9, bw, 3);
        ctx.fillStyle = '#4deeea';
        ctx.fillRect(o.x - bw/2, o.y - o.r - 9, bw * (o.hp/o.maxHp), 3);
      }
    });

    // player bullets
    ctx.fillStyle = '#4deeea';
    bullets.forEach(b=>{
      ctx.save();
      ctx.shadowColor = '#4deeea';
      ctx.shadowBlur = 8;
      ctx.fillRect(b.x-2, b.y-7, 4, 12);
      ctx.restore();
    });

    // projectiles
    ctx.fillStyle = '#ffce54';
    projectiles.forEach(p=>{
      ctx.save();
      ctx.shadowColor = '#ffce54';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    });

    // boss
    if(boss){
      ctx.save();
      ctx.shadowColor = '#f951a3';
      ctx.shadowBlur = 22;
      ctx.fillStyle = '#f951a3';
      ctx.beginPath();
      ctx.moveTo(boss.x, boss.y-26);
      ctx.lineTo(boss.x+26, boss.y+16);
      ctx.lineTo(boss.x-26, boss.y+16);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      const pct = Math.max(0, boss.hp/boss.maxHp);
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(W/2-60, 14, 120, 5);
      ctx.fillStyle = '#f951a3';
      ctx.fillRect(W/2-60, 14, 120*pct, 5);
    }

    // particles
    particles.forEach(p=>{
      ctx.globalAlpha = Math.max(p.life,0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,2.4,0,Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    // player
    ctx.save();
    ctx.shadowColor = '#4deeea';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#e8f1f5';
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function start(){
    reset();
    overlay.classList.add('hidden');
    scoreEl.textContent = '0';
    running = true;
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', start);

  // controls: pointer drag + arrow keys
  let dragging = false;
  function setTargetFromClientX(clientX){
    const rect = stage.getBoundingClientRect();
    targetX = clientX - rect.left;
  }
  stage.addEventListener('pointerdown', e=>{ dragging = true; setTargetFromClientX(e.clientX); });
  window.addEventListener('pointermove', e=>{ if(dragging) setTargetFromClientX(e.clientX); });
  window.addEventListener('pointerup', ()=> dragging = false);

  window.addEventListener('keydown', e=>{
    const k = e.key ? e.key.toLowerCase() : '';
    if(k === 'a') keyLeft = true;
    if(k === 'd') keyRight = true;
    if(k === ' ' && !running) start();
    if(k === 'f') firing = true;
  });
  window.addEventListener('keyup', e=>{
    const k = e.key ? e.key.toLowerCase() : '';
    if(k === 'a') keyLeft = false;
    if(k === 'd') keyRight = false;
    if(k === 'f') firing = false;
  });

  const fireBtn = document.getElementById('fireBtn');
  fireBtn.addEventListener('pointerdown', e=>{ e.stopPropagation(); firing = true; });
  fireBtn.addEventListener('pointerup', ()=> firing = false);
  fireBtn.addEventListener('pointerleave', ()=> firing = false);

  reset();
  draw();
})();
</script>
</body>
</html>
